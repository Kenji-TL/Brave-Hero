<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <!-- Caverna secreta dos heróis: carro na plataforma e central de computadores — ilustração original da Brave Hero -->
  <defs>
    <style>
      .ink { stroke: #0D0B12; stroke-linejoin: round; stroke-linecap: round; }
      .t { font-family: Impact, "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
    </style>
    <radialGradient id="glowCiano">
      <stop offset="0" stop-color="#5FE0C8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5FE0C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmarelo">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#5FE0C8" fill-opacity=".08"/>
    </pattern>
  </defs>

  <!-- rochas das laterais -->
  <path d="M-10 60 C50 40 110 90 160 70 C220 50 250 140 290 470 H-10 Z" fill="#1E1A2A" class="ink" stroke-width="4"/>
  <path d="M70 140 C100 150 120 200 118 260" fill="none" stroke="#332C45" stroke-width="4" stroke-linecap="round"/>
  <path d="M1610 40 C1580 30 1575 60 1590 90 L1610 470 Z" fill="#1E1A2A" class="ink" stroke-width="4"/>

  <!-- luminária pendurada sobre o carro -->
  <path d="M700 0 V70" stroke="#0D0B12" stroke-width="4"/>
  <path d="M672 70 H728 L744 96 H656 Z" fill="#2A2540" class="ink" stroke-width="4"/>
  <path d="M662 96 L520 480 H880 L738 96 Z" fill="#FFE9A8" fill-opacity=".06"/>

  <!-- chão -->
  <path d="M0 470 C400 450 1200 450 1600 470 V600 H0 Z" fill="#191623"/>
  <path d="M0 470 C400 450 1200 450 1600 470" fill="none" stroke="#2C2740" stroke-width="4"/>

  <!-- plataforma giratória -->
  <ellipse cx="700" cy="522" rx="420" ry="86" fill="url(#glowCiano)" opacity=".6"/>
  <ellipse cx="700" cy="520" rx="360" ry="56" fill="#24203A" class="ink" stroke-width="5"/>
  <ellipse cx="700" cy="520" rx="320" ry="46" fill="none" stroke="#5FE0C8" stroke-width="4" stroke-opacity=".7"/>
  <g stroke="#5FE0C8" stroke-opacity=".25" stroke-width="3">
    <path d="M380 520 H1020 M470 488 L930 552 M470 552 L930 488"/>
  </g>

  <!-- carro de herói -->
  <ellipse cx="700" cy="500" rx="300" ry="20" fill="#000000" fill-opacity=".35"/>
  <path d="M430 410 L412 372 L470 372 L486 404 Z" fill="#262233" class="ink" stroke-width="5"/>
  <rect x="402" y="362" width="84" height="12" rx="4" fill="#C9452F" class="ink" stroke-width="4"/>
  <!-- herói dirigindo (atrás do vidro) -->
  <path d="M650 402 C650 372 666 360 684 360 C702 360 718 372 718 402 Z" fill="#4FAF3B" class="ink" stroke-width="4"/>
  <path d="M652 382 C670 376 698 376 716 382 L716 392 C698 388 670 388 652 392 Z" fill="#0D0B12"/>
  <ellipse cx="674" cy="385" rx="5" ry="3.5" fill="#FFFFFF"/><ellipse cx="696" cy="385" rx="5" ry="3.5" fill="#FFFFFF"/>
  <path d="M430 490 L420 440 C418 420 430 410 450 408 L520 404 C560 360 620 340 700 338 C760 338 800 350 840 380 L930 402 C970 408 990 424 992 446 L994 476 C994 486 986 492 976 492 Z" fill="#262233" class="ink" stroke-width="6"/>
  <path d="M540 404 C575 368 625 352 695 350 C745 350 780 360 812 384 L820 402 Z" fill="#5FE0C8" fill-opacity=".45" class="ink" stroke-width="4"/>
  <path d="M580 392 C610 372 640 364 670 362" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
  <path d="M436 448 L988 448 L990 462 L438 462 Z" fill="#C9452F" class="ink" stroke-width="3"/>
  <path d="M560 416 C640 402 760 402 900 418" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="6" stroke-linecap="round"/>
  <circle cx="700" cy="428" r="24" fill="#E8B53A" class="ink" stroke-width="4"/>
  <circle cx="700" cy="428" r="18" fill="none" stroke="#C9452F" stroke-width="4"/>
  <text x="700" y="440" class="t" font-size="30" fill="#C9452F" text-anchor="middle">B</text>
  <path d="M966 420 L990 428 L990 440 L964 436 Z" fill="#FFF2B8" class="ink" stroke-width="3"/>
  <rect x="421" y="428" width="12" height="16" rx="3" fill="#C9452F" class="ink" stroke-width="2"/>
  <g class="ink" stroke-width="6">
    <circle cx="520" cy="488" r="44" fill="#14121C"/><circle cx="890" cy="488" r="44" fill="#14121C"/>
  </g>
  <g class="ink" stroke-width="4">
    <circle cx="520" cy="488" r="24" fill="#C9452F"/><circle cx="890" cy="488" r="24" fill="#C9452F"/>
    <circle cx="520" cy="488" r="8" fill="#E8B53A"/><circle cx="890" cy="488" r="8" fill="#E8B53A"/>
  </g>

  <!-- central de computadores -->
  <ellipse cx="1310" cy="250" rx="300" ry="170" fill="url(#glowCiano)" opacity=".5"/>
  <g class="ink" stroke-width="4" fill="#2A2540">
    <rect x="1300" y="340" width="20" height="62"/><rect x="1102" y="320" width="14" height="82"/><rect x="1504" y="320" width="14" height="82"/>
  </g>
  <!-- tela esquerda: radar da Ilha -->
  <path d="M1060 190 L1160 170 L1160 330 L1060 320 Z" fill="#0E2A33" class="ink" stroke-width="5"/>
  <g fill="none" stroke="#5FE0C8" stroke-opacity=".7" stroke-width="2">
    <ellipse cx="1110" cy="250" rx="36" ry="40"/><ellipse cx="1110" cy="250" rx="22" ry="25"/>
    <path d="M1110 250 L1138 222"/><path d="M1074 250 H1146 M1110 210 V290"/>
  </g>
  <circle cx="1124" cy="262" r="5" fill="#C9452F"/>
  <text x="1110" y="310" class="t" font-size="13" fill="#5FE0C8" text-anchor="middle">ILHA</text>
  <!-- tela central -->
  <rect x="1170" y="150" width="280" height="192" rx="10" fill="#0E2A33" class="ink" stroke-width="6"/>
  <rect x="1176" y="156" width="268" height="180" rx="6" fill="url(#scan)"/>
  <circle cx="1310" cy="226" r="44" fill="#E8B53A" class="ink" stroke-width="4"/>
  <circle cx="1310" cy="226" r="34" fill="none" stroke="#C9452F" stroke-width="5"/>
  <text x="1310" y="246" class="t" font-size="54" fill="#C9452F" text-anchor="middle">B</text>
  <text x="1310" y="306" class="t" font-size="18" fill="#5FE0C8" text-anchor="middle">SISTEMA BRAVE HERO</text>
  <rect x="1222" y="316" width="176" height="8" rx="4" fill="#5FE0C8" fill-opacity=".25"/>
  <rect x="1222" y="316" width="118" height="8" rx="4" fill="#5FE0C8" fill-opacity=".7"/>
  <!-- tela direita: gráficos -->
  <path d="M1460 170 L1560 190 L1560 320 L1460 330 Z" fill="#0E2A33" class="ink" stroke-width="5"/>
  <g fill="#E8B53A" fill-opacity=".8">
    <rect x="1478" y="270" width="12" height="36"/><rect x="1498" y="250" width="12" height="56"/>
    <rect x="1518" y="228" width="12" height="78"/><rect x="1538" y="260" width="10" height="46"/>
  </g>
  <path d="M1476 222 L1500 206 L1522 214 L1548 196" fill="none" stroke="#5FE0C8" stroke-width="3" stroke-opacity=".8"/>

  <!-- mesa de controle -->
  <path d="M1040 470 L1070 400 H1540 L1570 470 Z" fill="#2A2540" class="ink" stroke-width="5"/>
  <rect x="1040" y="470" width="530" height="44" fill="#1E1A2E" class="ink" stroke-width="5"/>
  <g>
    <circle cx="1110" cy="436" r="6" fill="#5FE0C8"/><circle cx="1132" cy="436" r="6" fill="#E8B53A"/><circle cx="1154" cy="436" r="6" fill="#C9452F"/>
    <rect x="1440" y="428" width="60" height="14" rx="4" fill="#5FE0C8" fill-opacity=".55"/>
    <rect x="1470" y="450" width="40" height="10" rx="3" fill="#E8B53A" fill-opacity=".6"/>
  </g>

  <!-- herói operando o computador (de costas) -->
  <path d="M1270 372 C1270 344 1288 330 1310 330 C1332 330 1350 344 1350 372 Z" fill="#2E9E97" class="ink" stroke-width="4"/>
  <path d="M1274 356 H1346" stroke="#0D0B12" stroke-width="8"/>
  <path d="M1342 356 L1362 350 L1356 364 Z" fill="#0D0B12"/>
  <rect x="1250" y="366" width="120" height="120" rx="30" fill="#25163F" class="ink" stroke-width="5"/>
  <rect x="1262" y="378" width="96" height="96" rx="22" fill="none" stroke="#E8B53A" stroke-width="3" stroke-opacity=".5"/>
  <rect x="1300" y="486" width="20" height="24" fill="#1E1A2E" class="ink" stroke-width="4"/>

  <!-- cabos no chão -->
  <path d="M1040 500 C980 540 900 560 800 566 C700 572 600 560 520 574" fill="none" stroke="#0D0B12" stroke-width="6" stroke-linecap="round"/>
  <path d="M1040 490 C990 520 960 580 860 590" fill="none" stroke="#2C2740" stroke-width="5" stroke-linecap="round"/>
</svg>
